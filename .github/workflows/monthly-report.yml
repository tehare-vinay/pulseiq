
name: PulseIQ Monthly Report

on:
  schedule:
    # Runs on the 1st day of every month at 7:30 AM IST
    - cron: "0 2 1 * *"

  workflow_dispatch:

jobs:
  generate-report:
    runs-on: [self-hosted, windows, x64]

    env:
      PULSEIQ_PGHOST: localhost
      PULSEIQ_PGPORT: "5432"
      PULSEIQ_PGUSER: pulseiq_user
      PULSEIQ_PGPASSWORD: ${{ secrets.PULSEIQ_PGPASSWORD }}
      PULSEIQ_PGDATABASE: pulseiq_warehouse

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv reportlab

      - name: Check PostgreSQL
        run: |
          docker ps

      - name: Generate Previous Month Report
        working-directory: phase-4/Task 16 - Automated Report Builder
        shell: pwsh
        run: |
          $reportMonth = (Get-Date).AddMonths(-1).ToString("yyyy-MM")
          python build_report.py --month $reportMonth

      - name: Upload Monthly PDF
        uses: actions/upload-artifact@v4
        with:
          name: PulseIQ-Monthly-Report
          path: phase-4/Task 16 - Automated Report Builder/reports/*.pdf
          if-no-files-found: error
          retention-days: 90
