
name: PulseIQ Monthly Report and Data Refresh

on:
  schedule:
    # Runs on the 1st of every month at 7:30 AM IST (02:00 UTC)
    - cron: "0 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: [self-hosted, windows, x64]

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: pulseiq_user
      PGPASSWORD: ${{ secrets.PULSEIQ_PGPASSWORD }}
      PGDATABASE: pulseiq_warehouse

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pandas psycopg2-binary python-dotenv pyarrow reportlab

      - name: Check PostgreSQL
        shell: pwsh
        run: |
          docker ps
          if ($LASTEXITCODE -ne 0) {
            throw "Docker is not running."
          }

      - name: Export Safe Aggregates
        shell: pwsh
        run: |
          python scripts/export_safe_aggregates.py
          if ($LASTEXITCODE -ne 0) {
            throw "Safe aggregate export failed."
          }

      - name: Convert and Verify Parquet
        shell: pwsh
        run: |
          python scripts/convert_to_parquet.py
          if ($LASTEXITCODE -ne 0) {
            throw "Parquet conversion or verification failed."
          }

      - name: Commit Refreshed Cloud Data
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cloud_data_public cloud_data_parquet

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Automated monthly cloud data refresh"
            git push origin master
          } else {
            Write-Host "No data changes to commit."
          }

      - name: Generate Previous Month Report
        working-directory: phase-4/Task 16 - Automated Report Builder
        shell: pwsh
        run: |
          $reportMonth = (Get-Date).AddMonths(-1).ToString("yyyy-MM")
          python build_report.py --month $reportMonth
          if ($LASTEXITCODE -ne 0) {
            throw "Monthly report generation failed."
          }

      - name: Upload Monthly PDF
        uses: actions/upload-artifact@v4
        with:
          name: PulseIQ-Monthly-Report
          path: phase-4/Task 16 - Automated Report Builder/reports/*.pdf
          if-no-files-found: error
          retention-days: 90
