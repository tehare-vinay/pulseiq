catalog: pulseiq_warehouse
schema: ''
sql: "SELECT\r\n    lt.leave_type_name,\r\n    SUM(l.end_date - l.start_date + 1)\
  \ AS total_leave_days\r\nFROM warehouse.fact_leave AS l\r\nJOIN warehouse.dim_leave_type\
  \ AS lt\r\n    ON l.leave_type_id = lt.leave_type_id\r\nWHERE LOWER(l.status) =\
  \ 'approved'\r\n  AND l.start_date IS NOT NULL\r\n  AND l.end_date IS NOT NULL\r\
  \n  AND l.end_date >= l.start_date\r\nGROUP BY lt.leave_type_name\r\nORDER BY total_leave_days\
  \ DESC;"
