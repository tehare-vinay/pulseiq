catalog: pulseiq_warehouse
schema: ''
sql: "SELECT\r\n    e.department_id,\r\n    SUM(a.present_days) AS present_days,\r\
  \n    SUM(a.scheduled_days) AS scheduled_days,\r\n    ROUND(\r\n        100.0 *\
  \ SUM(a.present_days) /\r\n        NULLIF(SUM(a.scheduled_days), 0), 2\r\n    )\
  \ AS attendance_rate_pct\r\nFROM warehouse.fact_attendance_monthly a\r\nJOIN warehouse.dim_employee\
  \ e\r\n    ON a.employee_key = e.employee_key\r\nGROUP BY e.department_id\r\nORDER\
  \ BY attendance_rate_pct ASC;"
