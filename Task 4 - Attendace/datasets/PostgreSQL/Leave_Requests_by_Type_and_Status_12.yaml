sql: "SELECT\r\n    lt.leave_type_name,\r\n    l.status,\r\n    COUNT(*) AS requests\r\
  \nFROM warehouse.fact_leave l\r\nJOIN warehouse.dim_leave_type lt\r\n    ON l.leave_type_id\
  \ = lt.leave_type_id\r\nGROUP BY\r\n    lt.leave_type_name,\r\n    l.status\r\n\
  ORDER BY\r\n    lt.leave_type_name,\r\n    l.status;"
