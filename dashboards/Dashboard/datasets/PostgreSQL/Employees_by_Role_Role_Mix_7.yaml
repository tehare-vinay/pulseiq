sql: "\r\nSELECT\r\n    r.role_title AS role,\r\n    COUNT(DISTINCT e.employee_id)\
  \ AS employee_count\r\nFROM warehouse.dim_employee e\r\nJOIN warehouse.dim_role\
  \ r\r\n    ON e.role_id = r.role_id\r\nWHERE e.employee_key <> -1\r\n  AND e.is_current\
  \ = TRUE\r\nGROUP BY r.role_title\r\nORDER BY employee_count DESC, r.role_title;"
