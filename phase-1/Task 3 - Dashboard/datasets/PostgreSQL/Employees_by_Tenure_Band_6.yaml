catalog: pulseiq_warehouse
schema: null
sql: "\r\nWITH employee_tenure AS (\r\n    SELECT\r\n        employee_id,\r\n    \
  \    CASE\r\n            WHEN CURRENT_DATE - hire_date < 365 THEN 'Under 1 year'\r\
  \n            WHEN CURRENT_DATE - hire_date < 1095 THEN '1\u20133 years'\r\n   \
  \         WHEN CURRENT_DATE - hire_date < 1825 THEN '3\u20135 years'\r\n       \
  \     ELSE '5+ years'\r\n        END AS tenure_band,\r\n        CASE\r\n       \
  \     WHEN CURRENT_DATE - hire_date < 365 THEN 1\r\n            WHEN CURRENT_DATE\
  \ - hire_date < 1095 THEN 2\r\n            WHEN CURRENT_DATE - hire_date < 1825\
  \ THEN 3\r\n            ELSE 4\r\n        END AS sort_order\r\n    FROM warehouse.dim_employee\r\
  \n    WHERE employee_key <> -1\r\n      AND is_current = TRUE\r\n      AND hire_date\
  \ IS NOT NULL\r\n)\r\nSELECT\r\n    tenure_band,\r\n    COUNT(DISTINCT employee_id)\
  \ AS employee_count\r\nFROM employee_tenure\r\nGROUP BY tenure_band, sort_order\r\
  \nORDER BY sort_order;\r\n"
