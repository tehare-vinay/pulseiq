catalog: pulseiq_warehouse
schema: ''
sql: "\r\nWITH monthly_exits AS (\r\n    SELECT COUNT(DISTINCT employee_id) AS exits\r\
  \n    FROM warehouse.dim_employee\r\n    WHERE exit_date >= DATE '2026-09-01'\r\n\
  \      AND exit_date <  DATE '2026-10-01'\r\n),\r\nstarting_headcount AS (\r\n \
  \   SELECT SUM(headcount_start) AS headcount\r\n    FROM warehouse.fact_headcount_monthly\r\
  \n    WHERE date_key = 20260930\r\n)\r\nSELECT\r\n    ROUND(\r\n        100.0 *\
  \ e.exits / NULLIF(h.headcount, 0),\r\n        2\r\n    ) AS monthly_attrition_rate\r\
  \nFROM monthly_exits e\r\nCROSS JOIN starting_headcount h;\r\n"
