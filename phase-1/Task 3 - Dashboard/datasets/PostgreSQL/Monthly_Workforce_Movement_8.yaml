catalog: pulseiq_warehouse
schema: null
sql: "\r\nWITH monthly_joiners AS (\r\n    SELECT\r\n        DATE_TRUNC('month', hire_date)::date\
  \ AS month,\r\n        COUNT(DISTINCT employee_id) AS joiners\r\n    FROM warehouse.dim_employee\r\
  \n    WHERE employee_key <> -1\r\n      AND hire_date IS NOT NULL\r\n    GROUP BY\
  \ 1\r\n),\r\nmonthly_endings AS (\r\n    SELECT\r\n        DATE_TRUNC('month', valid_to)::date\
  \ AS month,\r\n        COUNT(DISTINCT employee_id) AS record_endings\r\n    FROM\
  \ warehouse.dim_employee\r\n    WHERE employee_key <> -1\r\n      AND is_current\
  \ = FALSE\r\n      AND valid_to IS NOT NULL\r\n      AND valid_to < DATE '9999-12-31'\r\
  \n    GROUP BY 1\r\n),\r\nmonths AS (\r\n    SELECT month FROM monthly_joiners\r\
  \n    UNION\r\n    SELECT month FROM monthly_endings\r\n)\r\nSELECT\r\n    TO_CHAR(m.month,\
  \ 'YYYY-MM') AS month,\r\n    COALESCE(j.joiners, 0) AS joiners,\r\n    COALESCE(e.record_endings,\
  \ 0) AS record_endings,\r\n    COALESCE(j.joiners, 0)\r\n      - COALESCE(e.record_endings,\
  \ 0) AS net_change\r\nFROM months m\r\nLEFT JOIN monthly_joiners j ON j.month =\
  \ m.month\r\nLEFT JOIN monthly_endings e ON e.month = m.month\r\nORDER BY m.month;\r\
  \n"
