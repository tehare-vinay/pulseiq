catalog: pulseiq_warehouse
schema: ''
sql: "SELECT\r\n    TRIM(TO_CHAR(period_end_date, 'Day')) AS weekday,\r\n    EXTRACT(ISODOW\
  \ FROM period_end_date) AS weekday_order,\r\n    ROUND(\r\n        100.0 * SUM(present_days)\
  \ /\r\n        NULLIF(SUM(scheduled_days), 0),\r\n        2\r\n    ) AS attendance_rate_pct\r\
  \nFROM warehouse.fact_attendance_monthly\r\nGROUP BY\r\n    TRIM(TO_CHAR(period_end_date,\
  \ 'Day')),\r\n    EXTRACT(ISODOW FROM period_end_date)\r\nORDER BY weekday_order;"
