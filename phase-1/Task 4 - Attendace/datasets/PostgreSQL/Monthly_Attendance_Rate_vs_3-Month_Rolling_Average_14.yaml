table_name: Monthly Attendance Rate vs 3-Month Rolling Average
main_dttm_col: attendance_month
currency_code_column: null
description: null
default_endpoint: null
offset: 0
cache_timeout: null
catalog: pulseiq_warehouse
schema: ''
sql: "WITH monthly AS (\r\n    SELECT\r\n        DATE_TRUNC('month', period_end_date)::date\
  \ AS attendance_month,\r\n        SUM(present_days) AS present_days,\r\n       \
  \ SUM(scheduled_days) AS scheduled_days\r\n    FROM warehouse.fact_attendance_monthly\r\
  \n    GROUP BY 1\r\n),\r\nrolling AS (\r\n    SELECT\r\n        attendance_month,\r\
  \n        present_days,\r\n        scheduled_days,\r\n        ROUND(\r\n       \
  \     100.0 * present_days / NULLIF(scheduled_days, 0),\r\n            2\r\n   \
  \     ) AS attendance_rate_pct,\r\n        ROUND(\r\n            100.0 * SUM(present_days)\
  \ OVER (\r\n                ORDER BY attendance_month\r\n                ROWS BETWEEN\
  \ 2 PRECEDING AND CURRENT ROW\r\n            ) / NULLIF(\r\n                SUM(scheduled_days)\
  \ OVER (\r\n                    ORDER BY attendance_month\r\n                  \
  \  ROWS BETWEEN 2 PRECEDING AND CURRENT ROW\r\n                ), 0\r\n        \
  \    ),\r\n            2\r\n        ) AS rolling_3m_attendance_pct\r\n    FROM monthly\r\
  \n)\r\nSELECT *\r\nFROM rolling\r\nORDER BY attendance_month;"
