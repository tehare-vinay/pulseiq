catalog: pulseiq_warehouse
schema: ''
sql: "WITH monthly_latest AS (\r\n    SELECT\r\n        d.year,\r\n        d.month_number,\r\
  \n        f.department_id,\r\n        f.headcount_end,\r\n        ROW_NUMBER() OVER\
  \ (\r\n            PARTITION BY d.year, d.month_number, f.department_id\r\n    \
  \        ORDER BY d.calendar_date DESC\r\n        ) AS rn\r\n    FROM warehouse.fact_headcount_monthly\
  \ f\r\n    JOIN warehouse.dim_date d\r\n        ON f.date_key = d.date_key\r\n)\r\
  \nSELECT\r\n    MAKE_DATE(year, month_number, 1) AS month,\r\n    SUM(headcount_end)\
  \ AS total_headcount\r\nFROM monthly_latest\r\nWHERE rn = 1\r\nGROUP BY year, month_number\r\
  \nORDER BY year, month_number;"
